# Linux GPU runtime dependencies; PyTorch 2.5.1 / CUDA 11.8 and Accelerate via pip.
# Install UniMeth from the repository root with: python -m pip install --no-deps .
name: unimeth
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  - python=3.12
  - pip
  - "bioconda::pod5=0.3.48"
  - "bioconda::lib-pod5=0.3.48"
  - pyarrow=22.0.0
  - numpy>=2.0
  - transformers>=4.40,<5
  - tqdm>=4.66
  - pysam>=0.22
  - scikit-learn>=1.5
  - scipy>=1.13
  - packaging>=23
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu118
      - torch==2.5.1+cu118
      - accelerate>=1.0,<2
